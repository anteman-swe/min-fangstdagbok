spring.application.name=fiskeexperten

# Bilduppladdning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Ladda om mallar direkt under utveckling
spring.thymeleaf.cache=false

# Databas: PostgreSQL med PostGIS. Anslutningen styrs av miljövariabler (lösenordet ska aldrig stå i filen).
#   POSTGIS_HOST (localhost), POSTGIS_PORT (5432), POSTGIS_DB (gis), POSTGIS_USER (appuser), POSTGIS_PASSWORD
spring.datasource.url=jdbc:postgresql://${POSTGIS_HOST:localhost}:${POSTGIS_PORT:5432}/${POSTGIS_DB:gis}
spring.datasource.username=${POSTGIS_USER:appuser}
spring.datasource.password=${POSTGIS_PASSWORD:}

# Flyway (src/main/resources/db/migration) äger schemat, så Hibernate ändrar ingenting
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Demokonto: AV som standard, så att inga kända inloggningsuppgifter finns i en vanlig körning.
# För utveckling, kör med profilen "dev" (se application-dev.properties). Du kan också sätta
# fiskeexperten.demo.email och fiskeexperten.demo.losenord själv, t.ex. som miljövariabler.
# Är e-posten eller lösenordet tomt skapas inget demokonto. Är det på läggs det in (med fyra
# exempelfångster) första gången appen startar mot en tom databas.
fiskeexperten.demo.email=
fiskeexperten.demo.losenord=

spring.application.name=fiskeexperten

# Bilduppladdning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Ladda om mallar direkt under utveckling
spring.thymeleaf.cache=false

# Databas: PostgreSQL med PostGIS. Anslutningen styrs av miljövariabler (lösenordet ska aldrig stå i filen).
#   POSTGIS_HOST (localhost), POSTGIS_PORT (5432), POSTGIS_DB (gis), POSTGIS_USER (appuser), POSTGIS_PASSWORD
spring.datasource.url=jdbc:postgresql://${POSTGIS_HOST:localhost}:${POSTGIS_PORT:5432}/${POSTGIS_DB:gis}
spring.datasource.username=${POSTGIS_USER:appuser}
spring.datasource.password=${POSTGIS_PASSWORD:}

# Flyway (src/main/resources/db/migration) äger schemat, så Hibernate ändrar ingenting
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Demokonto för utveckling. Läggs in (med fyra exempelfångster) första gången appen startar
# mot en tom databas. Lämna e-post tom för att stänga av det.
fiskeexperten.demo.email=demo@fiskeexperten.se
fiskeexperten.demo.losenord=demo1234

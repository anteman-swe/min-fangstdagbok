spring.application.name=fiskeexperten

# Bilduppladdning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Ladda om mallar direkt under utveckling
spring.thymeleaf.cache=false

# Demokonto för utveckling. Användarna ligger i minnet och försvinner vid omstart,
# så det här kontot läggs in på nytt varje gång appen startar.
# Lämna e-post tom för att stänga av demokontot.
fiskeexperten.demo.email=demo@fiskeexperten.se
fiskeexperten.demo.losenord=demo1234

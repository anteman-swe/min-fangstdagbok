spring.application.name=fiskeexperten

# Bilduppladdning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Ladda om mallar direkt under utveckling
spring.thymeleaf.cache=false

# Databas: PostgreSQL med PostGIS (compose.yaml startar den automatiskt via spring-boot-docker-compose).
# OBS: application.properties i projektets rot läses också och har företräde när appen körs därifrån.
spring.datasource.url=jdbc:postgresql://${POSTGIS_HOST:localhost}:${POSTGIS_PORT:5432}/${POSTGIS_DB:gis}
spring.datasource.username=${POSTGIS_USER:appuser}
spring.datasource.password=${POSTGIS_PASSWORD:}

# Flyway (src/main/resources/db/migration) äger schemat. Hibernate kontrollerar bara att entiteterna matchar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Inloggningssessioner sparas i databasen. Tabellerna skapas av Flyway (V2__spring_session.sql).
spring.session.jdbc.initialize-schema=never

# Demokonto: AV som standard, så att inga kända inloggningsuppgifter finns i en vanlig körning.
# För utveckling, kör med profilen "dev" (se application-dev.properties).
# Är det på läggs kontot in (med fyra exempelfångster) första gången appen startar mot en tom databas.
fiskeexperten.demo.email=
fiskeexperten.demo.losenord=

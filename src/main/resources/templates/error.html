<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head('Något gick fel', 'Sidan kunde inte laddas.')}"></th:block></head>
<body>
<main class="flex min-h-screen items-center justify-center p-4">
    <div class="max-w-md text-center">
        <h1 class="text-xl font-semibold">Sidan kunde inte laddas</h1>
        <p class="mt-2 text-sm text-muted-foreground">
            Något gick fel<span th:if="${status}" th:text="| (felkod ${status})|"></span>.
            Försök igen eller gå tillbaka till kartan.
        </p>
        <a th:href="@{/karta}" class="mt-6 inline-block rounded-xl bg-primary px-5 py-3 font-semibold text-primary-foreground transition hover:opacity-90">Till kartan</a>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head('Logga in', 'Logga in på FiskeExperten och se dina fångster på kartan.')}"></th:block></head>
<body>
<main class="grid min-h-screen lg:grid-cols-2">
    <section th:replace="~{fragments/layout :: authHero('Varje fångst har en plats.', 'Spara bild, art och position. Se alla dina fiskeplatser på kartan.')}"></section>

    <section class="flex items-center justify-center p-6">
        <!-- Spring Security tar emot formuläret på POST /login (se SecurityConfig) -->
        <form th:action="@{/login}" method="post" class="w-full max-w-sm rounded-3xl bg-card p-8 shadow-soft">
            <div th:replace="~{fragments/layout :: mobilLogga}"></div>
            <h2 class="text-3xl font-bold">Välkommen tillbaka</h2>
            <p class="mt-1 text-sm text-muted-foreground">Logga in för att se dina fångster.</p>

            <p th:if="${param.fel}" role="alert" class="mt-4 rounded-xl bg-destructive/10 p-3 text-sm text-destructive">Fel e-postadress eller lösenord.</p>
            <p th:if="${param.utloggad}" role="status" class="mt-4 rounded-xl bg-muted p-3 text-sm">Du är utloggad.</p>
            <p th:if="${param.skapad}" role="status" class="mt-4 rounded-xl bg-muted p-3 text-sm">Kontot är skapat – logga in nedan.</p>

            <label for="email" class="mt-6 block text-sm font-medium">E-post</label>
            <div class="mt-1 flex items-center gap-2 rounded-xl border border-input bg-background px-3 focus-within:border-ring">
                <svg th:replace="~{fragments/icons :: mail('h-4 w-4 shrink-0 text-muted-foreground')}"></svg>
                <input id="email" name="email" type="email" required autocomplete="email" placeholder="du@exempel.se" class="w-full bg-transparent py-3 outline-none">
            </div>

            <label for="losenord" class="mt-4 block text-sm font-medium">Lösenord</label>
            <div class="mt-1 flex items-center gap-2 rounded-xl border border-input bg-background px-3 focus-within:border-ring">
                <svg th:replace="~{fragments/icons :: lock('h-4 w-4 shrink-0 text-muted-foreground')}"></svg>
                <input id="losenord" name="losenord" type="password" required autocomplete="current-password" placeholder="••••••••" class="w-full bg-transparent py-3 outline-none">
            </div>

            <button type="submit" class="mt-6 w-full cursor-pointer rounded-xl bg-primary py-3 font-semibold text-primary-foreground transition hover:opacity-90">Logga in</button>
            <p class="mt-4 text-center text-sm text-muted-foreground">
                Inget konto? <a th:href="@{/registrera}" class="font-semibold text-primary hover:underline">Skapa konto</a>
            </p>
        </form>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head('Karta & fångster', 'Se dina fångster på kartan och registrera nya.')}"></th:block></head>
<body>

<header th:replace="~{fragments/layout :: header('karta')}"></header>

<!-- ===== Karta ===== -->
<section class="relative isolate h-[60vh] bg-land" aria-label="Karta med dina fångster">
    <!-- Leaflet ritar kartan här. data-vald = fångst som ska öppnas direkt (t.ex. efter att man sparat) -->
    <div id="karta" class="absolute inset-0 bg-water" th:data-vald="${vald}"></div>

    <button type="button" data-oppna-form
            class="absolute right-6 bottom-6 z-[1001] flex cursor-pointer items-center gap-2 rounded-full bg-accent px-5 py-3 font-semibold text-accent-foreground shadow-soft transition hover:scale-105">
        <svg th:replace="~{fragments/icons :: plus('h-5 w-5 shrink-0')}"></svg> Ny fångst
    </button>
</section>

<!-- Meddelande efter att en fångst sparats/ändrats/raderats -->
<div th:if="${meddelande}" th:text="${meddelande}" role="status"
     class="toast fixed bottom-6 left-1/2 z-[1200] -translate-x-1/2 rounded-full bg-lake px-5 py-3 font-semibold text-lake-foreground shadow-soft">Sparad!</div>

<!-- ===== Lista med fångster ===== -->
<section id="fangster" class="mx-auto max-w-6xl scroll-mt-16 p-6">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold">Alla fångster</h2>
            <p class="text-muted-foreground" th:text="${#lists.size(fangster)} + ' registrerade'">4 registrerade</p>
        </div>
        <form th:action="@{/karta}" method="get" role="search"
              class="flex items-center gap-2 rounded-xl border border-input bg-card px-3 focus-within:border-ring">
            <svg th:replace="~{fragments/icons :: search('h-4 w-4 shrink-0 text-muted-foreground')}"></svg>
            <input type="search" name="q" th:value="${q}" placeholder="Sök art eller plats" aria-label="Sök art eller plats" class="bg-transparent py-2 outline-none">
        </form>
    </div>

    <p th:if="${#lists.isEmpty(fangster)}" class="mt-6 text-muted-foreground">
        Inga fångster hittades<span th:if="${not #strings.isEmpty(q)}" th:text="| för ”${q}”|"></span>.
        <a th:href="@{/karta}" class="font-semibold text-primary hover:underline">Visa alla</a>
    </p>

    <div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
        <!-- Klick på ett kort öppnar fångsten på kartan (karta.js läser data-attributen) -->
        <article th:each="f : ${fangster}" tabindex="0" data-fangst
                 class="cursor-pointer overflow-hidden rounded-2xl bg-card shadow-soft transition hover:-translate-y-1 focus-visible:-translate-y-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
                 th:data-id="${f.id}"
                 th:data-art="${f.art}"
                 th:data-matt="${f.matt}"
                 th:data-datum="${f.datumText}"
                 th:data-plats="${f.plats}"
                 th:data-stil="${f.stil}"
                 th:data-lat="${f.lat}"
                 th:data-lng="${f.lng}"
                 th:data-bild="${f.harBild} ? @{/fangster/{id}/bild(id=${f.id},v=${f.bildNyckel})}">
            <div class="flex h-36 items-center justify-center overflow-hidden text-lake-foreground" th:classappend="${f.harBild} ? '' : ${f.stil}">
                <img th:if="${f.harBild}" class="h-full w-full object-cover" alt=""
                     th:src="@{/fangster/{id}/bild(id=${f.id},v=${f.bildNyckel})}" th:alt="${f.art}">
                <th:block th:unless="${f.harBild}">
                    <svg th:replace="~{fragments/icons :: fish('h-14 w-14')}"></svg>
                </th:block>
            </div>
            <div class="p-4">
                <div class="flex items-baseline justify-between gap-2">
                    <h3 class="text-xl font-bold" th:text="${f.art}">Gädda</h3>
                    <span class="text-sm text-muted-foreground" th:text="${f.datumText}">12 nov</span>
                </div>
                <p class="mt-1 text-sm" th:text="${f.matt}">4,2 kg · 82 cm</p>
                <p class="mt-2 flex items-center gap-1 text-sm text-muted-foreground">
                    <svg th:replace="~{fragments/icons :: mapPin('h-3 w-3 shrink-0')}"></svg>
                    <span th:text="${f.plats}">Mälaren, Västerås</span>
                </p>
                <!-- Redigera / radera (klick här ska inte öppna kartan, se karta.js) -->
                <div data-ingen-karta class="mt-3 flex justify-end gap-1 border-t border-border pt-2">
                    <a th:href="@{/karta(redigera=${f.id})}" title="Redigera" aria-label="Redigera"
                       class="inline-flex rounded-lg p-1 text-muted-foreground hover:bg-muted hover:text-foreground">
                        <svg th:replace="~{fragments/icons :: pencil('h-4 w-4')}"></svg>
                    </a>
                    <form th:action="@{/fangster/{id}/radera(id=${f.id})}" method="post" data-bekrafta-radera th:data-art="${f.art}">
                        <button type="submit" title="Radera" aria-label="Radera"
                                class="inline-flex cursor-pointer rounded-lg p-1 text-muted-foreground hover:bg-destructive/10 hover:text-destructive">
                            <svg th:replace="~{fragments/icons :: trash('h-4 w-4')}"></svg>
                        </button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</section>

<!-- ===== Panel: Registrera / redigera fångst ===== -->
<th:block th:replace="~{catch-form :: catchForm}"></th:block>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/karta.js}"></script>
</body>
</html>

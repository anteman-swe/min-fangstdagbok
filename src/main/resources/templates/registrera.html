<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Skapa konto – FiskeExperten')}"></head>
<body>

<main class="login">

    <!-- Vänster sida: samma gradient som på inloggningssidan (döljs på mobil) -->
    <section class="login-hero">
        <div class="brand brand--lg">
            <svg th:replace="~{fragments/icons :: fish('icon icon-lg')}"></svg> FiskeExperten
        </div>
        <div class="login-hero__text">
            <h1>Börja logga dina fångster.</h1>
            <p>Skapa ett konto så sparas bild, art och position på kartan.</p>
        </div>
        <div class="login-hero__sun"></div>
        <svg class="waves" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
            <path fill="currentColor" opacity=".5" d="M0 60 Q75 20 150 60 T300 60 T450 60 T600 60 V120 H0Z"/>
            <path fill="currentColor" d="M0 85 Q75 50 150 85 T300 85 T450 85 T600 85 V120 H0Z"/>
        </svg>
    </section>

    <!-- Höger sida: registreringsformulär -->
    <section class="login-form-wrap">
        <form class="login-card" th:action="@{/registrera}" th:object="${registreringForm}" method="post" novalidate>
            <div class="brand brand--mobile">
                <svg th:replace="~{fragments/icons :: fish('icon')}"></svg> FiskeExperten
            </div>

            <h2>Skapa konto</h2>
            <p class="muted small mt-1">Det tar en minut.</p>

            <label for="email" class="label mt-6">E-post</label>
            <div class="input-icon">
                <svg th:replace="~{fragments/icons :: mail('icon icon-sm muted')}"></svg>
                <input id="email" type="email" th:field="*{email}" placeholder="du@exempel.se" autocomplete="email">
            </div>
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="losenord" class="label mt-4">Lösenord</label>
            <div class="input-icon">
                <svg th:replace="~{fragments/icons :: lock('icon icon-sm muted')}"></svg>
                <input id="losenord" type="password" name="losenord" placeholder="Minst 8 tecken" autocomplete="new-password">
            </div>
            <p class="error" th:if="${#fields.hasErrors('losenord')}" th:errors="*{losenord}"></p>

            <label for="losenordIgen" class="label mt-4">Upprepa lösenordet</label>
            <div class="input-icon">
                <svg th:replace="~{fragments/icons :: lock('icon icon-sm muted')}"></svg>
                <input id="losenordIgen" type="password" name="losenordIgen" placeholder="Samma lösenord igen" autocomplete="new-password">
            </div>
            <p class="error" th:if="${#fields.hasErrors('losenordIgen')}" th:errors="*{losenordIgen}"></p>

            <button type="submit" class="btn btn-primary btn-block mt-6">Skapa konto</button>

            <p class="center small muted mt-4">
                Har du redan ett konto? <a th:href="@{/}" class="link">Logga in</a>
            </p>
        </form>
    </section>

</main>

</body>
</html>

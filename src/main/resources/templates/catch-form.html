<!-- Panelen "Registrera fångst" / "Redigera fångst". Inkluderas i karta.html. -->
<div th:fragment="catchForm" xmlns:th="http://www.thymeleaf.org"
     id="drawer" class="drawer fixed inset-0 z-[1300] hidden justify-end bg-lake/40"
     th:classappend="${formOppet} ? 'is-open'"
     th:data-avbryt-url="${fangstForm.redigerar} ? @{/karta}">
    <aside role="dialog" aria-modal="true" aria-labelledby="drawer-titel"
           class="drawer__panel h-full w-full max-w-md overflow-y-auto bg-background p-6 shadow-soft">
        <div class="flex items-center justify-between">
            <h2 id="drawer-titel" class="text-2xl font-bold"
                th:text="${fangstForm.redigerar} ? 'Redigera fångst' : 'Registrera fångst'">Registrera fångst</h2>
            <button type="button" data-stang-form aria-label="Stäng" class="inline-flex cursor-pointer rounded-lg p-1 hover:bg-muted">
                <svg th:replace="~{fragments/icons :: x('h-5 w-5')}"></svg>
            </button>
        </div>

        <form th:action="${fangstForm.redigerar} ? @{/fangster/{id}(id=${fangstForm.id})} : @{/fangster}"
              th:object="${fangstForm}" method="post" enctype="multipart/form-data" novalidate>

            <!-- Bild: klicka eller dra hit -->
            <label id="dropzone" class="dropzone relative mt-6 flex h-40 cursor-pointer flex-col items-center justify-center gap-2 overflow-hidden rounded-2xl border-2 border-dashed border-primary/40 bg-muted text-muted-foreground">
                <img id="bild-preview" alt="Förhandsvisning av bilden" class="pointer-events-none absolute inset-0 h-full w-full object-cover"
                     th:src="${redigerad != null and redigerad.harBild} ? @{/fangster/{id}/bild(id=${redigerad.id},v=${redigerad.bildNyckel})}">
                <svg th:replace="~{fragments/icons :: upload('h-6 w-6')}"></svg>
                <span class="text-sm" th:text="${redigerad != null and redigerad.harBild} ? 'Klicka för att byta bild' : 'Dra hit en bild eller klicka'">Dra hit en bild eller klicka</span>
                <input type="file" id="bild" name="bild" accept="image/*" class="absolute inset-0 z-10 cursor-pointer opacity-0">
            </label>
            <p th:if="${#fields.hasErrors('bild')}" th:errors="*{bild}" class="mt-1 text-[13px] text-destructive"></p>

            <!-- TODO (Trello: AI-kortet): koppla till Spring AI -->
            <button type="button" disabled title="Kommer snart"
                    class="mt-3 flex w-full cursor-not-allowed items-center justify-center gap-2 rounded-xl bg-secondary py-2 text-sm font-semibold text-secondary-foreground opacity-60">
                <svg th:replace="~{fragments/icons :: sparkles('h-4 w-4 text-accent')}"></svg> Identifiera art med AI
            </button>

            <div class="mt-4">
                <label for="art" class="block text-sm font-medium">Art</label>
                <input type="text" th:field="*{art}" th:errorclass="has-error" placeholder="t.ex. Gädda" class="falt">
                <p th:if="${#fields.hasErrors('art')}" th:errors="*{art}" class="mt-1 text-[13px] text-destructive"></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="mt-4">
                    <label for="vikt" class="block text-sm font-medium">Vikt (kg)</label>
                    <input type="number" step="0.1" min="0" th:field="*{vikt}" th:errorclass="has-error" placeholder="4,2" class="falt">
                    <p th:if="${#fields.hasErrors('vikt')}" th:errors="*{vikt}" class="mt-1 text-[13px] text-destructive"></p>
                </div>
                <div class="mt-4">
                    <label for="langd" class="block text-sm font-medium">Längd (cm)</label>
                    <input type="number" step="1" min="0" th:field="*{langd}" th:errorclass="has-error" placeholder="82" class="falt">
                    <p th:if="${#fields.hasErrors('langd')}" th:errors="*{langd}" class="mt-1 text-[13px] text-destructive"></p>
                </div>
            </div>

            <div class="mt-4">
                <label for="datum" class="block text-sm font-medium">Datum</label>
                <input type="date" th:field="*{datum}" th:errorclass="has-error" class="falt">
                <p th:if="${#fields.hasErrors('datum')}" th:errors="*{datum}" class="mt-1 text-[13px] text-destructive"></p>
            </div>

            <div class="mt-4">
                <label for="plats" class="block text-sm font-medium">Plats <span class="text-muted-foreground">(valfritt)</span></label>
                <input type="text" th:field="*{plats}" th:errorclass="has-error" placeholder="t.ex. Mälaren, Västerås" class="falt">
                <p th:if="${#fields.hasErrors('plats')}" th:errors="*{plats}" class="mt-1 text-[13px] text-destructive"></p>
            </div>

            <div class="mt-4">
                <span class="block text-sm font-medium">Position</span>
                <div id="position-karta" class="mt-1 h-40 overflow-hidden rounded-xl bg-land"></div>
                <p class="mt-1.5 flex items-center gap-1 text-sm">
                    <svg th:replace="~{fragments/icons :: mapPin('h-4 w-4 shrink-0 text-accent')}"></svg>
                    <span id="position-varde">Klicka på kartan för att välja position</span>
                </p>
                <input type="hidden" th:field="*{lat}">
                <input type="hidden" th:field="*{lng}">
                <p th:if="${#fields.hasErrors('lat') or #fields.hasErrors('lng')}" class="mt-1 text-[13px] text-destructive">
                    Klicka på kartan för att välja position
                </p>
            </div>

            <button type="submit" class="mt-6 w-full cursor-pointer rounded-xl bg-primary py-3 font-semibold text-primary-foreground transition hover:opacity-90"
                    th:text="${fangstForm.redigerar} ? 'Spara ändringar' : 'Spara fångst'">Spara fångst</button>
        </form>
    </aside>
</div>
